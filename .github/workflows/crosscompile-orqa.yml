name: Cross-compile OpenHD-Glide with Orqa SDK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev-release
      - openhd-3.0

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            ninja-build \
            pkg-config \
            xz-utils

      - name: Retrieve Orqa SDK installer
        run: |
          set -euo pipefail
          curl -# -u "${DOWNLOAD_KEY}" -O "${DOWNLOAD_URL}"
          test -f SDK-DTK_GCB_working_usb_and_88x2eu.sh

      - name: Install Orqa SDK
        env:
          SDK_INSTALL_DIR: ${{ runner.temp }}/orqa-sdk
        run: |
          set -euo pipefail
          mkdir -p "$SDK_INSTALL_DIR"
          sh SDK-DTK_GCB_working_usb_and_88x2eu.sh -y -d "$SDK_INSTALL_DIR"

      - name: Configure OpenHD-Glide for Orqa
        env:
          SDK_INSTALL_DIR: ${{ runner.temp }}/orqa-sdk
        run: |
          set -euo pipefail
          source "$SDK_INSTALL_DIR/environment-setup-armv8a-poky-linux"
          cmake -S . -B build-orqa -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DOPENHD_GLIDE_DEVICE_KMS=ON \
            -DOPENHD_GLIDE_REQUIRE_KMS_GBM=ON \
            -DOPENHD_GLIDE_ENABLE_GSTREAMER=OFF \
            -DOPENHD_GLIDE_REQUIRE_GSTREAMER=OFF \
            -DOPENHD_GLIDE_REQUIRE_FREETYPE=ON \
            -DOPENHD_GLIDE_ENABLE_SDL2=OFF \
            -DOPENHD_GLIDE_ENABLE_CEDAR=OFF \
            -DOPENHD_GLIDE_ENABLE_RKMPP=OFF \
            -DOPENHD_GLIDE_REQUIRE_RKMPP=OFF \
            -DOPENHD_GLIDE_ENABLE_IMXVPU=ON \
            -DOPENHD_GLIDE_REQUIRE_IMXVPU=ON \
            -DOPENHD_GLIDE_PREFER_SYSTEM_MESA=OFF

      - name: Build OpenHD-Glide
        env:
          SDK_INSTALL_DIR: ${{ runner.temp }}/orqa-sdk
        run: |
          set -euo pipefail
          source "$SDK_INSTALL_DIR/environment-setup-armv8a-poky-linux"
          cmake --build build-orqa --parallel

      - name: Verify live Orqa runtime ABI
        env:
          SDK_INSTALL_DIR: ${{ runner.temp }}/orqa-sdk
        run: |
          set -euo pipefail
          source "$SDK_INSTALL_DIR/environment-setup-armv8a-poky-linux"
          bash scripts/verify-orqa-runtime-abi.sh build-orqa

      - name: Install and strip artifact
        env:
          SDK_INSTALL_DIR: ${{ runner.temp }}/orqa-sdk
          DESTDIR: ${{ runner.temp }}/openhd-glide-orqa-rootfs
        run: |
          set -euo pipefail
          source "$SDK_INSTALL_DIR/environment-setup-armv8a-poky-linux"
          cmake --install build-orqa
          find "$DESTDIR/usr/bin" -maxdepth 1 -type f -exec "$STRIP" --strip-unneeded {} +
          cp build-orqa/orqa-needed.txt "$DESTDIR/"
          tar -C "$DESTDIR" -czf openhd-glide-orqa-aarch64.tar.gz .

      - name: Upload Orqa artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhd-glide-orqa-aarch64
          path: |
            openhd-glide-orqa-aarch64.tar.gz
            build-orqa/orqa-needed.txt
