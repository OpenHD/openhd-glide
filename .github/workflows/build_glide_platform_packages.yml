name: build_glide_platform_packages

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev-release"
      - "release"
      - "openhd-3.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_type: radxa-zero3w
            package_suffix: radxa-zero3w
            package_arch: arm64
            cloudsmith_distro: debian
            release: bookworm
            radxa_repo_suite: rk3566-bookworm
            require_rkmpp: "1"
            extra_debian_depends: "gstreamer1.0-tools, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, gstreamer1.0-rockchip1, librockchip-mpp1, librga2"
          - image_type: orangepi-zero3w-lite
            package_suffix: orangepi-zero3w
            package_arch: arm64
            cloudsmith_distro: debian
            release: bookworm
            radxa_repo_suite: bookworm
            require_rkmpp: "0"
            extra_debian_depends: "gstreamer1.0-tools, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav"
          - image_type: radxa-cubie
            package_suffix: radxa-cubie
            package_arch: arm64
            cloudsmith_distro: debian
            release: bullseye
            radxa_repo_suite: bullseye
            require_rkmpp: "0"
            extra_debian_depends: "gstreamer1.0-tools, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav"
          - image_type: rock5a
            package_suffix: rock5a
            package_arch: arm64
            cloudsmith_distro: debian
            release: bookworm
            radxa_repo_suite: rk3588-bookworm
            require_rkmpp: "1"
            extra_debian_depends: "gstreamer1.0-tools, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, gstreamer1.0-rockchip1, librockchip-mpp1, librga2"
          - image_type: rock5b
            package_suffix: rock5b
            package_arch: arm64
            cloudsmith_distro: debian
            release: bookworm
            radxa_repo_suite: rk3588-bookworm
            require_rkmpp: "1"
            extra_debian_depends: "gstreamer1.0-tools, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, gstreamer1.0-rockchip1, librockchip-mpp1, librga2"
          - image_type: radxa-cm5
            package_suffix: radxa-cm5
            package_arch: arm64
            cloudsmith_distro: debian
            release: bookworm
            radxa_repo_suite: rk3588-bookworm
            require_rkmpp: "1"
            extra_debian_depends: "gstreamer1.0-tools, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, gstreamer1.0-rockchip1, librockchip-mpp1, librga2"
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      OPENHD_RCLONE_CONFIG_GDRIVE: ${{ secrets.OPENHD_GDRIVE_RCLONE_CONFIG }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          overprovision-lvm: "true"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build OpenHD-Glide in CHROOT
        env:
          GLIDE_IMAGE_TYPE: ${{ matrix.image_type }}
          GLIDE_PACKAGE_SUFFIX: ${{ matrix.package_suffix }}
          GLIDE_PACKAGE_ARCH: ${{ matrix.package_arch }}
          GLIDE_CLOUDSMITH_DISTRO: ${{ matrix.cloudsmith_distro }}
          GLIDE_RELEASE: ${{ matrix.release }}
          GLIDE_RADXA_REPO_SUITE: ${{ matrix.radxa_repo_suite }}
          GLIDE_REQUIRE_RKMPP: ${{ matrix.require_rkmpp }}
          GLIDE_EXTRA_DEBIAN_DEPENDS: ${{ matrix.extra_debian_depends }}
        run: bash scripts/ci-build-platform-package.sh

      - name: Collect artifacts
        run: |
          find /opt/OpenHD-ChrootCompiler/out "$GITHUB_WORKSPACE"/chroot-out-* -maxdepth 1 -name '*.deb' -exec cp {} . \;

      - name: Upload to Github
        uses: "actions/upload-artifact@v4"
        with:
          name: "OpenHD-Glide-${{ matrix.package_suffix }}-${{ matrix.release }}-${{ matrix.package_arch }}"
          path: |
            *.deb

      - name: Push
        if: github.ref_name == 'release' || github.ref_name == 'dev-release' || github.ref_name == 'main'
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: "push"
          format: "deb"
          owner: "openhd"
          repo: ${{ github.ref_name == 'main' && 'dev-release' || github.ref_name }}
          distro: "${{ matrix.cloudsmith_distro }}"
          release: "${{ matrix.release }}"
          republish: "true"
          file: "*.deb"
